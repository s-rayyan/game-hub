<!DOCTYPE html>
<html lang="en">

<head>

<body data-bs-theme="dark">
  <!-- Announcement Banner -->
  <div id="promo-banner" class="bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 text-white px-4 py-3 shadow-lg relative flex items-center justify-between transition-all duration-300">
    <div class="flex items-center justify-center w-full gap-3 text-sm md:text-base font-semibold">
      <span class="bg-white/20 text-white text-xs px-2 py-1 rounded-full uppercase tracking-wider">New</span>
      <span>Check out my new game, <strong>Oversteer</strong>!</span>
      <a href="https://oversteer.onrender.com" class="bg-white text-purple-900 hover:bg-gray-100 px-4 py-1.5 rounded-full text-xs md:text-sm font-bold shadow transition hover:scale-105 active:scale-95">
        Play Now &rarr;
      </a>
    </div>
    <button onclick="document.getElementById('promo-banner').style.display='none'" class="text-white/80 hover:text-white text-xl font-bold px-2 focus:outline-none" aria-label="Close banner">
      &times;
    </button>
  </div>

  <div class="main px-8 py-10 flex flex-col gap-8">
    <div class="header flex flex-col items-center gap-6">
      <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">
        <span class="theme-label">Theme</span>
      </button>
      <div>
        <div class="text-4xl md:text-5xl font-bold text-white text-center mb-2 tracking-wide">Rayyan's Game Hub</div>
        <div class="text-center text-white/70 text-base md:text-lg">Click to play • Double-click to favorite</div>
      </div>
      <div class="w-full max-w-2xl">
        <input type="text" id="search" placeholder="Search games...">
      </div>
    </div>

    <div id="game-links" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-start"></div>
  </div>

  <script src="script.mjs" type="module"></script>
