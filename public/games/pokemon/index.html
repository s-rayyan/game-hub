<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading GBA ROM...</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-purple-600/20 border border-purple-500/40 flex items-center justify-center mx-auto mb-4 text-purple-400 text-2xl animate-bounce">
            <i class="fa-solid fa-download"></i>
        </div>

        <h1 class="text-xl font-bold mb-2">Downloading Game ROM</h1>
        <p class="text-xs text-gray-400 mb-6">
            Your browser is downloading <code class="text-purple-300 font-mono">game.gba</code>. Once completed, load this file into WebRetro.
        </p>

        <!-- Redirect Banner -->
        <div class="bg-gray-950 border border-gray-800 rounded-xl p-4 mb-6 text-left">
            <div class="text-[10px] uppercase font-bold tracking-wider text-gray-500 mb-1">Target Directory</div>
            <div class="text-xs font-mono text-purple-300">../webretro</div>
        </div>

        <button id="btn-manual-redirect" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-purple-600/30 transition text-xs flex items-center justify-center gap-2">
            <span>Proceed to WebRetro Now</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const romPath = './game.gba';
            const redirectUrl = '/games/webretro';

            // 1. Trigger the download of ./game.gba
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = romPath;
            downloadAnchor.download = 'game.gba';
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);

            // 2. Alert the user after triggering download
            setTimeout(() => {
                alert("The ROM file (game.gba) has been downloaded!\n\nPlease select/load the downloaded 'game.gba' file inside WebRetro to play.");
                
                // 3. Redirect to ../webretro
                window.location.href = redirectUrl;
            }, 500);

            // Fallback manual redirect button click
            document.getElementById('btn-manual-redirect').addEventListener('click', () => {
                window.location.href = redirectUrl;
            });
        });
    </script>
</body>
</html>
